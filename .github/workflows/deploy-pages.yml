# VECINOS — Despliegue a GitHub Pages (v1.77).
#
# El juego entero es cliente (Babylon.js + sim determinista en el navegador), así que
# Pages lo sirve tal cual: build de export estático con basePath /VECINOS y sin rutas
# /api/* (el cliente ya degrada: guardado en localStorage, telemetría en pausa,
# multijugador con aviso honesto). Pages ya está configurado con build_type "workflow",
# así que este workflow es la fuente de la verdad: cada push a main despliega.
#
# URL pública: https://franjavierdavila.github.io/VECINOS/
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Export estático (basePath /VECINOS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      # output:'export' no admite route handlers con POST: las /api/* viven solo en el
      # despliegue con servidor (el checkout es efímero, fuera no rompen nada).
      - name: Retirar rutas de servidor (incompatibles con export estático)
        run: rm -rf src/app/api

      - name: Build estático
        env:
          VECINOS_STATIC_EXPORT: '1'
          NEXT_PUBLIC_STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /VECINOS
        run: bun run build:static

      # GitHub Pages ignora carpetas que empiezan por _ (Jekyll): sin .nojekyll, /_next/ muere.
      - name: Marca .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publicar en Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
